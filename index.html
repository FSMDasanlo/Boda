<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Lo celebramos!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Meta tags para ocultar la UI del navegador en modo App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <main class="welcome-section">
        <div class="card">
            <div class="card-face card-front">
                <p class="wedding-date">6-6-2026</p>
                <div class="welcome-text">
                    <span class="lang-1">Bienvenidos</span>
                    <span class="lang-2">Welcome</span>
                    <span class="lang-3">Bienvenue</span>
                    <span class="lang-4">Willkommen</span>
                    <span class="lang-5">स्वागत छ</span>
                </div>
                <div class="wedding-info">
                    <p class="wedding-message">
                        <span class="text-es">Es un día inolvidable para nosotros.<br>Gracias por formar parte de él.</span>
                        <span class="text-en">Today is an unforgettable day for us.<br>Thank you for being a part of it.</span>
                    </p>
                    <a href="#" class="memory-button">
                        <span class="text-es">Déjanos un mensaje</span>
                        <span class="text-en">Leave a message</span>
                    </a>
                </div>
            </div>
            <div class="card-face card-back">
                <div id="confirmation-message" class="confirmation-message"></div>
                <h2>Mensaje / Message</h2>
                <form id="memory-form">
                    <input type="text" id="guest-name" class="name-input" placeholder="Tu nombre" required>
                    <!-- 1. Controles de edición de texto -->
                    <div class="editor-toolbar">
                        <div class="emoji-container">
                            <button type="button" id="emoji-btn" class="toolbar-btn" title="Añadir emoji">😊</button>
                            <div id="emoji-panel" class="emoji-panel"></div>
                        </div>
                    </div>
                    <div id="message-box" class="editable" contenteditable="true" spellcheck="false"></div>
                    <div id="char-counter" class="char-counter"></div>
                    <div class="upload-section">
                        <button type="button" id="upload-photo-button" title="Añadir foto">+ Photo</button>
                        <input type="file" id="photo-upload" accept="image/*" hidden multiple>
                        <div id="image-preview-container"></div>
                    </div>
                    <button type="submit" class="submit-button">Enviar / Send</button>
                </form>
                <button type="button" class="back-button">Volver / Back</button>
            </div>
        </div>
    </main>

    <!-- Firebase Hosting SDKs (se inyectan automáticamente) -->
    <script src="/__/firebase/8.10.1/firebase-app.js"></script>
    <script src="/__/firebase/8.10.1/firebase-firestore.js"></script>
    <script src="/__/firebase/8.10.1/firebase-storage.js"></script>
    <script src="/__/firebase/init.js"></script>

    <!-- Librería para compresión de imágenes en el navegador -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>

    <script src="js/main.js"></script>
</body>
</html>
